# Variante standalone de MS3: su propio Postgres y RabbitMQ, con la topología mínima
# que MS3 consume y publica (topology/). Sirve para probar MS3 solo, sin la plataforma.
# Para correr dentro de la plataforma se usa contracting.compose.yml.

name: nurtricenter-ms3

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nur_tricenter_contracting
      POSTGRES_USER: dev-only
      POSTGRES_PASSWORD: dev-only-password
    ports:
      - "5434:5432"
    volumes:
      - ms3-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev-only -d nur_tricenter_contracting"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:3-management-alpine
    user: "0:0"
    command: ["bash", "-c", "chmod 0400 /var/lib/rabbitmq/.erlang.cookie 2>/dev/null || true; exec /opt/rabbitmq/sbin/rabbitmq-server"]
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./topology/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./topology/rabbitmq-definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=nur_tricenter_contracting;Username=dev-only;Password=dev-only-password"
      Migrations__ApplyOnStartup: "true"
      Seed__Enabled: "true"
      Swagger__Enabled: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Nurtricenter.MS3.WorkerService/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=nur_tricenter_contracting;Username=dev-only;Password=dev-only-password"
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: "Warning"
      RabbitMqSettings__Host: "rabbitmq"
      RabbitMqSettings__UserName: "guest"
      RabbitMqSettings__Password: "guest"
      RabbitMqSettings__VirtualHost: "/"
      RabbitMqSettings__MaxRetryAttempts: "3"
      RabbitMqSettings__RetryBaseDelayMilliseconds: "500"
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ms3-postgres-data:
